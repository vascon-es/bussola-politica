services:
  - type: web
    name: bussola-politica
    runtime: static
    # Não há build: o app é só o index.html.
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
